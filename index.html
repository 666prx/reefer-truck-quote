<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>冷藏车报价配置器</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        brand: { DEFAULT: '#00856A', light: '#00B96B', bg: '#F0FDF6', border: '#A7F3D0' }
      }
    }
  }
}
</script>
<style>
* { -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
.sh-card { box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04); }
.sh-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.08), 0 1px 4px rgba(0,0,0,.04); transform: translateY(-2px); }
.trans-card { transition: all .2s ease; }
.page { display: none; min-height: 100vh; }
.page.active { display: block; animation: fadeIn .25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.step-dot { transition: all .3s ease; }
.step-dot.done { background: #00B96B; }
.step-dot.active { background: #00856A; box-shadow: 0 0 0 4px rgba(0,133,106,.15); }
.radio-check { transition: all .15s ease; }
.selected-card .radio-check { border-color: #00856A !important; background: #00856A !important; }
.vehicle-img { min-height: 160px; object-fit: cover; background: linear-gradient(135deg,#e5e7eb,#d1d5db); }
@media (min-width: 768px) { .vehicle-img { min-height: 200px; } }
@media print {
  .no-print { display: none !important; }
  body { background: white; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body class="bg-[#F7F8FA] text-[#111827]">

<!-- ==================== PAGE 1: VEHICLE SELECTION ==================== -->
<div class="page active" id="page-home">
  <!-- Header -->
  <div class="sticky top-0 z-50 bg-white/90 backdrop-blur border-b border-gray-100">
    <div class="max-w-[1280px] mx-auto px-4 h-14 flex items-center gap-3">
      <span class="text-2xl">🚛</span>
      <div class="flex-1">
        <h1 class="text-base font-semibold">冷藏车报价配置器</h1>
        <p class="text-xs text-gray-400">选车型 · 配方案 · 出报价</p>
      </div>
      <a href="admin.html" class="text-xs text-gray-400 hover:text-brand transition-colors flex items-center gap-1 flex-shrink-0"><i class="fa-solid fa-gear"></i><span class="hidden sm:inline">管理</span></a>
    </div>
  </div>

  <!-- Search + Filter -->
  <div class="max-w-[1280px] mx-auto px-4 pt-4">
    <div class="flex items-center gap-3 mb-3">
      <!-- Tabs -->
      <div class="flex gap-1.5 overflow-x-auto flex-1" id="filterBar">
        <button class="filter-chip whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium transition-all bg-brand text-white" data-filter="all">全部</button>
        <button class="filter-chip whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium transition-all bg-white text-gray-500 border border-gray-200 hover:border-brand-light hover:text-brand" data-filter="纯电">⚡ 纯电动</button>
        <button class="filter-chip whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium transition-all bg-white text-gray-500 border border-gray-200 hover:border-brand-light hover:text-brand" data-filter="混动">🔌 混动</button>
        <button class="filter-chip whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium transition-all bg-white text-gray-500 border border-gray-200 hover:border-brand-light hover:text-brand" data-filter="燃油">⛽ 燃油</button>
      </div>
      <!-- Search -->
      <div class="relative flex-shrink-0 w-48 hidden sm:block">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
        <input type="text" id="searchInput" placeholder="搜索车型..." oninput="onSearch()"
          class="w-full h-9 pl-9 pr-3 rounded-lg border border-gray-200 text-sm focus:border-brand focus:ring-2 focus:ring-brand/10 outline-none transition-all">
      </div>
    </div>
    <!-- Mobile search -->
    <div class="sm:hidden mb-3 relative">
      <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
      <input type="text" id="searchInputM" placeholder="搜索车型..." oninput="syncSearch(this)"
        class="w-full h-10 pl-9 pr-3 rounded-lg border border-gray-200 text-sm focus:border-brand focus:ring-2 focus:ring-brand/10 outline-none transition-all">
    </div>
    <p class="text-xs text-gray-400 mb-3" id="productCount"></p>
  </div>

  <!-- Vehicle Cards -->
  <div class="max-w-[1280px] mx-auto px-4 pb-8" id="productList"></div>
</div>

<!-- ==================== PAGE 2: CONFIGURATION ==================== -->
<div class="page" id="page-config">
  <!-- Step Progress Bar -->
  <div class="sticky top-0 z-50 bg-white/90 backdrop-blur border-b border-gray-100">
    <div class="max-w-[1280px] mx-auto px-4 h-14 flex items-center justify-between">
      <button onclick="goHome()" class="flex items-center gap-1.5 text-sm text-gray-500 hover:text-brand transition-colors">
        <i class="fa-solid fa-arrow-left text-xs"></i> 返回车型列表
      </button>
      <div class="flex items-center gap-3 text-sm">
        <div class="flex items-center gap-1.5">
          <span class="step-dot active w-2.5 h-2.5 rounded-full inline-block" id="sd1"></span>
          <span class="font-semibold text-brand">1. 选择配置</span>
        </div>
        <i class="fa-solid fa-chevron-right text-xs text-gray-300"></i>
        <div class="flex items-center gap-1.5">
          <span class="step-dot w-2.5 h-2.5 rounded-full inline-block bg-gray-300" id="sd2"></span>
          <span class="text-gray-400">2. 确认报价</span>
        </div>
      </div>
      <div></div>
    </div>
  </div>

  <div class="max-w-[1280px] mx-auto px-4 py-5 pb-28">
    <div class="flex flex-col lg:flex-row gap-5">
      <!-- Left: Config Options (70%) -->
      <div class="lg:w-[70%]" id="configLeft"></div>

      <!-- Right: Price Summary (30%, sticky) -->
      <div class="lg:w-[30%]">
        <div class="lg:sticky lg:top-20 bg-white rounded-xl sh-card p-5" id="configRight"></div>
      </div>
    </div>
  </div>

  <!-- Mobile bottom bar -->
  <div class="lg:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 sh-card px-4 py-3 z-50" style="padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px))">
    <div class="flex items-center justify-between">
      <div><span class="text-xs text-gray-400">预估落地价</span><div class="text-xl font-bold text-brand" id="barPrice">¥0</div></div>
      <button onclick="showQuote()" class="bg-brand hover:bg-brand/90 text-white px-6 py-2.5 rounded-lg font-semibold text-sm transition-all active:scale-95">下一步：查看报价 →</button>
    </div>
  </div>
</div>

<!-- ==================== PAGE 3: QUOTE ==================== -->
<div class="page" id="page-quote">
  <!-- Top Bar -->
  <div class="no-print sticky top-0 z-50 bg-white/90 backdrop-blur border-b border-gray-100">
    <div class="max-w-[1280px] mx-auto px-4 h-14 flex items-center justify-between">
      <button onclick="backToConfig()" class="flex items-center gap-1.5 text-sm text-gray-500 hover:text-brand transition-colors">
        <i class="fa-solid fa-arrow-left text-xs"></i> 报价单
      </button>
      <div class="flex gap-2">
        <button onclick="shareQuote()" class="text-sm px-3 py-1.5 rounded-lg border border-gray-200 text-gray-500 hover:border-brand hover:text-brand transition-all"><i class="fa-solid fa-share-nodes mr-1"></i>分享</button>
        <button id="exportPdfBtn" onclick="window.print()" class="text-sm px-3 py-1.5 rounded-lg border border-gray-200 text-gray-500 hover:border-brand hover:text-brand transition-all"><i class="fa-solid fa-download mr-1"></i>导出PDF</button>
        <button id="saveImgBtn" onclick="saveQuoteImage()" style="display:none" class="text-sm px-3 py-1.5 rounded-lg border border-gray-200 text-gray-500 hover:border-brand hover:text-brand transition-all"><i class="fa-solid fa-image mr-1"></i>保存图片</button>
      </div>
    </div>
  </div>

  <div class="max-w-[1280px] mx-auto px-4 py-5 pb-12" id="quoteContent"></div>
</div>

<script src="data.js?v=20260804a"></script>
<script>
// ============ DATA ============
var PRODUCTS = (function() {
  // localStorage 数据仅在版本号与已发布 data.js 一致时使用，防止发布后客户读到旧数据
  try {
    var ver = localStorage.getItem('reefer_truck_products_ver');
    if (ver && String(ver) === String(DATA_VERSION)) {
      var s = localStorage.getItem('reefer_truck_products');
      if (s) return JSON.parse(s);
    }
  } catch(e) {}
  return typeof PRODUCT_DATA !== 'undefined' ? PRODUCT_DATA : [];
})();

var currentProduct = null, selectedBox = 0, selectedAC = 0, selectedAddons = new Set();
var currentFilter = 'all', searchQuery = '';

// ============ FORMAT ============
function fmt(n) { return (n/10000).toFixed(2); }
function fmtFull(n) { return '¥' + n.toLocaleString('zh-CN'); }

// ============ HOME PAGE ============
function getFiltered() {
  var list = PRODUCTS;
  if (currentFilter !== 'all') list = list.filter(function(p) { return p.powerType === currentFilter; });
  if (searchQuery) {
    var q = searchQuery.toLowerCase();
    list = list.filter(function(p) { return p.name.toLowerCase().indexOf(q) !== -1 || p.brand.toLowerCase().indexOf(q) !== -1; });
  }
  return list;
}

function onSearch() { searchQuery = document.getElementById('searchInput').value.trim(); renderHome(); }
function syncSearch(el) { searchQuery = el.value.trim(); document.getElementById('searchInput').value = searchQuery; renderHome(); }

var ICONS = {'电机':'⚡','发动机':'🔧','电池':'🔋','续航':'🛣️','厢体容积':'📦','载重':'🚚','制动':'🛑','变速箱':'⚙️','质保':'🛡️','综合马力':'🐎','燃料':'⛽','油箱':'🛢️','轮胎':'🔄','充电':'🔌','冷机':'❄️'};
function sIcon(k) { return ICONS[k] || '📋'; }

function getPowerClass(type) {
  if (type === '纯电') return 'bg-emerald-50 text-emerald-700';
  if (type === '混动') return 'bg-indigo-50 text-indigo-700';
  return 'bg-orange-50 text-orange-700';
}

function renderHome() {
  var filtered = getFiltered();
  document.getElementById('productCount').textContent = '共 ' + filtered.length + ' 款车型';
  var list = document.getElementById('productList');
  if (filtered.length === 0) {
    list.innerHTML = '<div class="text-center py-16 text-gray-400"><i class="fa-solid fa-inbox text-4xl mb-3 block"></i>没有匹配的车型</div>';
    return;
  }
  list.innerHTML = filtered.map(function(p) {
    var specs = Object.entries(p.specs || {}).slice(0, 5);
    var hasImg = p.image && p.image.length > 0;
    var hasDiscount = p.sellingPrice && p.sellingPrice < p.basePrice;
    return '<div class="bg-white rounded-xl sh-card trans-card cursor-pointer overflow-hidden mb-4 hover:border-brand/30 border border-transparent" onclick="startConfig(\''+p.id+'\')">' +
      '<div class="flex flex-col sm:flex-row">' +
        // Left: image
        '<div class="sm:w-72 flex-shrink-0">' +
          (hasImg ? '<img src="'+p.image+'" class="vehicle-img w-full h-48 sm:h-52" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'" loading="lazy"><div class="vehicle-img items-center justify-center text-5xl text-gray-300" style="display:none">🚛</div>'
                  : '<div class="vehicle-img flex items-center justify-center text-6xl text-gray-300">🚛</div>') +
        '</div>' +
        // Right: info
        '<div class="flex-1 p-4 flex flex-col justify-between">' +
          '<div>' +
            '<div class="flex items-center gap-2 mb-1">' +
              '<span class="text-xs font-semibold text-brand uppercase tracking-wide">'+p.brand+'</span>' +
              '<span class="text-xs px-2 py-0.5 rounded font-medium '+getPowerClass(p.powerType)+'">'+p.powerType+'</span>' +
            '</div>' +
            '<h3 class="text-base font-semibold mb-2.5">'+p.name+'</h3>' +
            '<div class="flex flex-wrap gap-1.5 mb-3">' +
              specs.map(function(s) { return '<span class="text-xs bg-gray-50 text-gray-600 px-2 py-1 rounded-md inline-flex items-center gap-1"><span>'+sIcon(s[0])+'</span>'+s[1]+'</span>'; }).join('') +
            '</div>' +
          '</div>' +
          '<div class="flex items-end justify-between pt-3 border-t border-gray-50">' +
            '<div>' +
              (hasDiscount ? '<p class="text-xs text-gray-400 line-through">裸车 '+fmt(p.basePrice)+'万</p>' : '<p class="text-xs text-gray-400">裸车价</p>') +
              '<p class="text-xl font-bold text-brand">' + fmt(p.sellingPrice || p.basePrice) + '<span class="text-sm font-normal text-gray-400"> 万</span></p>' +
            '</div>' +
            '<span class="bg-brand hover:bg-brand/90 text-white px-5 py-2 rounded-lg text-sm font-semibold transition-colors active:scale-95 whitespace-nowrap">立即报价 →</span>' +
          '</div>' +
        '</div>' +
      '</div></div>';
  }).join('');
}

// ============ FILTER ============
document.getElementById('filterBar').addEventListener('click', function(e) {
  var chip = e.target.closest('.filter-chip');
  if (!chip) return;
  document.querySelectorAll('#filterBar .filter-chip').forEach(function(c) {
    c.className = 'filter-chip whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium transition-all bg-white text-gray-500 border border-gray-200 hover:border-brand-light hover:text-brand';
  });
  chip.className = 'filter-chip whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium transition-all bg-brand text-white';
  currentFilter = chip.dataset.filter;
  renderHome();
});

// ============ CONFIG PAGE ============
function startConfig(productId) {
  currentProduct = PRODUCTS.find(function(p) { return p.id === productId; });
  if (!currentProduct) return;
  selectedBox = 0; selectedAC = 0; selectedAddons = new Set();
  showPage('page-config');
  document.getElementById('sd1').className = 'step-dot active w-2.5 h-2.5 rounded-full inline-block bg-brand';
  document.getElementById('sd2').className = 'step-dot w-2.5 h-2.5 rounded-full inline-block bg-gray-300';
  renderConfig(); updatePrice();
}

function calcTotal() {
  var p = currentProduct;
  var base = p.sellingPrice || p.basePrice;
  var extra = p.boxes[selectedBox].price;
  if (selectedAC > 0 && p.optionalAC[selectedAC - 1]) extra += p.optionalAC[selectedAC - 1].price;
  p.addons.forEach(function(a, i) { if (selectedAddons.has(i)) extra += a.price; });
  var fees = (p.otherFees ? (p.otherFees.insurance||0)+(p.otherFees.registration||0) : 0);
  var subsidy = selectedAddons.has('subsidy') ? (p.subsidy || 0) : 0;
  return { base: base, extra: extra, fees: fees, subsidy: subsidy, total: base + extra + fees - subsidy };
}

function renderConfig() {
  var p = currentProduct, html = '';

  // Box section
  html += '<div class="mb-5"><h3 class="text-sm font-semibold mb-3 flex items-center gap-2"><span class="text-lg">📦</span>箱体选择</h3>';
  p.boxes.forEach(function(box, i) {
    var sel = selectedBox === i;
    html += '<div class="relative bg-white border-2 rounded-xl p-4 mb-2.5 cursor-pointer trans-card '+(sel ? 'selected-card border-brand bg-brand-bg' : 'border-gray-100 hover:border-gray-200')+'" onclick="selectBox('+i+')">' +
      (sel ? '<i class="fa-solid fa-circle-check absolute top-3 right-3 text-brand text-lg"></i>' : '') +
      '<div class="flex items-start gap-3 pr-7"><div class="w-5 h-5 rounded-full border-2 flex-shrink-0 mt-0.5 radio-check '+(sel?'border-brand bg-brand':'border-gray-300')+'">'+(sel?'<i class="fa-solid fa-check text-white text-xs m-auto block text-center leading-5"></i>':'')+'</div>' +
      '<div class="flex-1"><p class="font-medium text-sm">'+box.name+(i===0?' <span class="inline-block text-xs px-1.5 py-0.5 rounded bg-brand-bg text-brand font-semibold border border-brand-border">推荐</span>':'')+'</p>' +
      '<p class="text-xs text-gray-400 mt-1">'+(box.desc||'')+'</p></div>' +
      '<div class="text-right flex-shrink-0"><span class="text-sm font-semibold '+(box.price===0?'text-brand':(i===0?'text-gray-700':'text-red-500'))+'">'+(box.price===0?'标配':(i===0?'¥'+fmt(box.price)+'万':'+¥'+fmt(box.price)+'万'))+'</span></div></div></div>';
  });
  html += '</div>';

  // AC section
  html += '<div class="mb-5"><h3 class="text-sm font-semibold mb-3 flex items-center gap-2"><span class="text-lg">❄️</span>冷机选择</h3>';
  // Default AC
  var defSel = selectedAC === 0;
  html += '<div class="relative bg-white border-2 rounded-xl p-4 mb-2.5 cursor-pointer trans-card '+(defSel ? 'selected-card border-brand bg-brand-bg' : 'border-gray-100 hover:border-gray-200')+'" onclick="selectAC(0)">' +
    (defSel ? '<i class="fa-solid fa-circle-check absolute top-3 right-3 text-brand text-lg"></i>' : '') +
    '<div class="flex items-start gap-3 pr-7"><div class="w-5 h-5 rounded-full border-2 flex-shrink-0 mt-0.5 radio-check '+(defSel?'border-brand bg-brand':'border-gray-300')+'">'+(defSel?'<i class="fa-solid fa-check text-white text-xs m-auto block text-center leading-5"></i>':'')+'</div>' +
    '<div class="flex-1"><p class="font-medium text-sm">'+p.defaultAC.name+'（标配）<span class="inline-block text-xs px-1.5 py-0.5 rounded bg-brand-bg text-brand font-semibold border border-brand-border">推荐</span></p>' +
    '<p class="text-xs text-gray-400 mt-0.5">'+(p.defaultAC.temp||'')+' · 销售价 ¥'+(p.defaultAC.fullPrice||0).toLocaleString()+'</p></div>' +
    '<div class="text-right flex-shrink-0"><span class="text-sm font-semibold text-brand">¥' + fmt(p.defaultAC.fullPrice||0) + '万</span></div></div></div>';
  // Optional AC — sorted by price descending (upgrades first, then discounts)
  var sortedAC = p.optionalAC.map(function(ac, i) { return { ac: ac, idx: i + 1 }; });
  sortedAC.sort(function(a, b) { return b.ac.price - a.ac.price; });
  var seenDivider = false;
  sortedAC.forEach(function(item) {
    var ac = item.ac, idx = item.idx;
    var sel = selectedAC === idx;
    var priceLabel, priceClass;
    if (ac.price > 0) { priceLabel = '+¥' + fmt(ac.price) + '万'; priceClass = 'text-red-500'; }
    else if (ac.price < 0) { priceLabel = '-¥' + fmt(Math.abs(ac.price)) + '万'; priceClass = 'text-brand'; }
    else { priceLabel = '同价'; priceClass = 'text-gray-400'; }
    // Visual divider between upgrades (+) and value options (-)
    if (!seenDivider && ac.price <= 0) {
      seenDivider = true;
      html += '<div class="flex items-center gap-3 my-3"><div class="flex-1 border-t border-gray-200"></div><span class="text-xs text-gray-400 flex-shrink-0">经济型冷机</span><div class="flex-1 border-t border-gray-200"></div></div>';
    }
    html += '<div class="relative bg-white border-2 rounded-xl p-4 mb-2.5 cursor-pointer trans-card '+(sel ? 'selected-card border-brand bg-brand-bg' : 'border-gray-100 hover:border-gray-200')+'" onclick="selectAC('+idx+')">' +
      (sel ? '<i class="fa-solid fa-circle-check absolute top-3 right-3 text-brand text-lg"></i>' : '') +
      '<div class="flex items-start gap-3 pr-7"><div class="w-5 h-5 rounded-full border-2 flex-shrink-0 mt-0.5 radio-check '+(sel?'border-brand bg-brand':'border-gray-300')+'">'+(sel?'<i class="fa-solid fa-check text-white text-xs m-auto block text-center leading-5"></i>':'')+'</div>' +
      '<div class="flex-1"><p class="font-medium text-sm">'+ac.name+'</p>' +
      '<p class="text-xs text-gray-400 mt-0.5">'+(ac.temp||'')+' · 销售价 ¥'+(ac.fullPrice||0).toLocaleString()+'</p></div>' +
      '<div class="text-right flex-shrink-0"><span class="text-sm font-semibold '+priceClass+'">'+priceLabel+'</span></div></div></div>';
  });
  html += '</div>';

  // Addons
  html += '<div class="mb-5"><h3 class="text-sm font-semibold mb-3 flex items-center gap-2"><span class="text-lg">🔧</span>选装配件</h3>';
  if (p.addons.length === 0) {
    html += '<div class="text-center py-8 text-gray-400 text-sm">暂无选装件</div>';
  } else {
    p.addons.forEach(function(a, i) {
      var on = selectedAddons.has(i);
      html += '<div class="bg-white border-2 rounded-xl p-4 mb-2.5 flex items-center justify-between gap-3 cursor-pointer trans-card '+(on ? 'selected-card border-brand bg-brand-bg' : 'border-gray-100 hover:border-gray-200')+'" onclick="toggleAddon('+i+')">' +
        '<div class="flex-1"><p class="font-medium text-sm">'+a.name+'</p></div>' +
        '<div class="flex items-center gap-3 flex-shrink-0">' +
          '<span class="text-sm font-semibold text-red-500">+¥'+fmt(a.price)+'万</span>' +
          '<div class="w-11 h-6 rounded-full relative transition-colors '+(on ? 'bg-brand' : 'bg-gray-300')+'"><div class="absolute top-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform '+(on ? 'translate-x-[22px]' : 'translate-x-0.5')+'"></div></div>' +
        '</div></div>';
    });
  }
  html += '</div>';

  // Subsidy
  if (p.subsidy > 0) {
    var subOn = selectedAddons.has('subsidy');
    html += '<div class="mb-5"><h3 class="text-sm font-semibold mb-3 flex items-center gap-2"><span class="text-lg">💰</span>国家补贴</h3>';
    html += '<div class="bg-white border-2 rounded-xl p-4 flex items-center justify-between gap-3 cursor-pointer trans-card '+(subOn ? 'selected-card border-brand bg-brand-bg' : 'border-gray-100 hover:border-gray-200')+'" onclick="toggleSubsidy()">' +
      '<div class="flex-1"><p class="font-medium text-sm">新能源营运补贴</p><p class="text-xs text-gray-400 mt-0.5">上营运户可享</p></div>' +
      '<div class="flex items-center gap-3 flex-shrink-0">' +
        '<span class="text-sm font-semibold text-brand">-¥'+fmt(p.subsidy)+'万</span>' +
        '<div class="w-11 h-6 rounded-full relative transition-colors '+(subOn ? 'bg-brand' : 'bg-gray-300')+'"><div class="absolute top-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform '+(subOn ? 'translate-x-[22px]' : 'translate-x-0.5')+'"></div></div>' +
      '</div></div></div>';
  }

  document.getElementById('configLeft').innerHTML = html;
  renderPricePanel();
}

function renderPricePanel() {
  var p = currentProduct, b = calcTotal();
  var box = p.boxes[selectedBox];
  var ac = selectedAC === 0 ? p.defaultAC : p.optionalAC[selectedAC - 1];
  var panel = document.getElementById('configRight');
  var html = '<h3 class="font-semibold text-sm mb-4">💰 报价汇总</h3>';

  html += '<div class="flex justify-between items-center py-2 text-sm"><span class="text-gray-500">裸车价格</span><span class="font-semibold">'+fmtFull(b.base)+'</span></div>';
  var boxPriceHtml = box.price===0?' (标配)':(selectedBox===0?' ¥'+fmtFull(box.price):' +'+fmtFull(box.price));
  html += '<div class="flex justify-between items-center py-2 text-sm"><span class="text-gray-500">厢体</span><span class="font-medium">'+box.name + boxPriceHtml+'</span></div>';
  var acPriceHtml = '(标配)';
  if (selectedAC > 0) {
    if (ac.price > 0) acPriceHtml = ' +' + fmtFull(ac.price);
    else if (ac.price < 0) acPriceHtml = ' <span class=\"text-brand\">-' + fmtFull(Math.abs(ac.price)) + '</span>';
    else acPriceHtml = ' (同价)';
  }
  html += '<div class="flex justify-between items-center py-2 text-sm"><span class="text-gray-500">冷机</span><span class="font-medium">'+ac.name + ' ' + acPriceHtml+'</span></div>';

  p.addons.forEach(function(a,i) {
    if (selectedAddons.has(i)) html += '<div class="flex justify-between items-center py-2 text-sm"><span class="text-gray-500">'+a.name+'</span><span class="font-medium text-red-500">+'+fmtFull(a.price)+'</span></div>';
  });

  html += '<div class="flex justify-between items-center py-2 text-sm"><span class="text-gray-500">保险 · 上户</span><span class="font-medium">'+fmtFull(b.fees)+'</span></div>';

  if (b.subsidy > 0) {
    html += '<div class="flex justify-between items-center py-2 text-sm text-brand"><span>国家补贴</span><span class="font-semibold">-'+fmtFull(b.subsidy)+'</span></div>';
  }

  html += '<div class="border-t-2 border-dashed border-gray-200 my-3"></div>';
  html += '<div class="flex justify-between items-center"><span class="text-base font-semibold">预估落地总价</span><span class="text-2xl font-bold text-brand">'+fmtFull(b.total)+'</span></div>';
  html += '<p class="text-xs text-gray-400 text-right mt-0.5">'+fmt(b.total)+'万</p>';

  html += '<div class="flex flex-col gap-2 mt-4">';
  html += '<button onclick="resetConfig()" class="w-full py-2.5 rounded-lg border-2 border-gray-200 text-gray-500 text-sm font-medium hover:border-gray-300 hover:text-gray-600 transition-all active:scale-95">清空配置</button>';
  html += '<button onclick="showQuote()" class="w-full py-2.5 rounded-lg bg-brand hover:bg-brand/90 text-white text-sm font-semibold transition-all active:scale-95">下一步：查看报价 →</button>';
  html += '</div>';

  panel.innerHTML = html;
}

function resetConfig() {
  selectedBox = 0; selectedAC = 0; selectedAddons = new Set();
  renderConfig(); updatePrice();
}

function selectBox(i) { selectedBox = i; renderConfig(); updatePrice(); }
function selectAC(i) { selectedAC = i; renderConfig(); updatePrice(); }
function toggleAddon(i) { selectedAddons.has(i) ? selectedAddons.delete(i) : selectedAddons.add(i); renderConfig(); updatePrice(); }
function toggleSubsidy() { selectedAddons.has('subsidy') ? selectedAddons.delete('subsidy') : selectedAddons.add('subsidy'); renderConfig(); updatePrice(); }

function updatePrice() {
  var total = fmt(calcTotal().total);
  document.getElementById('barPrice').innerHTML = '¥' + total + '<span class="text-sm font-normal text-gray-400"> 万</span>';
}

// ============ QUOTE PAGE ============
function showQuote() {
  if (!currentProduct) return;
  var p = currentProduct, b = calcTotal();
  var box = p.boxes[selectedBox];
  var ac = selectedAC === 0 ? p.defaultAC : p.optionalAC[selectedAC - 1];
  var now = new Date();
  var quoteNo = 'QD' + now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0') + '-' + Math.random().toString(36).substring(2,6).toUpperCase();
  var timeStr = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');

  // 移动端（含微信内置浏览器）window.print 无效，改用"保存图片"；桌面端保留导出PDF
  var isMobileUI = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 0 && window.innerWidth < 768);
  var pdfBtn = document.getElementById('exportPdfBtn');
  var imgBtn = document.getElementById('saveImgBtn');
  if (pdfBtn) pdfBtn.style.display = isMobileUI ? 'none' : '';
  if (imgBtn) imgBtn.style.display = isMobileUI ? '' : 'none';

  // Update step indicator
  document.getElementById('sd1').className = 'step-dot done w-2.5 h-2.5 rounded-full inline-block';
  document.getElementById('sd1').style.background = '#00B96B';
  document.getElementById('sd2').className = 'step-dot active w-2.5 h-2.5 rounded-full inline-block';
  document.getElementById('sd2').style.background = '#00856A';
  document.getElementById('sd2').style.boxShadow = '0 0 0 4px rgba(0,133,106,.15)';

  var html = '';

  // Price disclaimer banner
  html += '<div class="bg-amber-50 border-2 border-amber-300 rounded-xl p-4 mb-5 text-sm text-amber-900 flex items-start gap-3">' +
    '<i class="fa-solid fa-triangle-exclamation text-amber-500 mt-0.5"></i>' +
    '<div><p class="font-semibold mb-1">报价价格说明</p>' +
    '<p class="text-amber-800 leading-relaxed">当前报价价格仅作参考，具体金额请联系 <a href="tel:18084808070" class="font-bold underline text-amber-900">18084808070</a> 出详细报价方案</p></div></div>';

  // Two-column: specs left, image right
  html += '<div class="flex flex-col md:flex-row gap-5 mb-5">';
  // Left: Vehicle specs
  html += '<div class="flex-1 bg-white rounded-xl sh-card p-5">';
  html += '<h3 class="font-semibold text-base mb-3 pb-2 border-b-2 border-brand inline-block">车辆参数</h3>';
  html += '<div class="mt-3 space-y-1">';
  Object.entries(p.specs||{}).forEach(function(s) {
    html += '<div class="flex justify-between py-2 text-sm border-b border-gray-50"><span class="text-gray-500">'+s[0]+'</span><span class="font-medium">'+s[1]+'</span></div>';
  });
  html += '</div></div>';

  // Right: Image + timestamp stamp
  html += '<div class="md:w-80 flex-shrink-0 bg-white rounded-xl sh-card overflow-hidden relative">';
  if (p.image) {
    html += '<img src="'+p.image+'" class="w-full h-48 object-cover" onerror="this.parentElement.innerHTML=\'<div class=w-full+h-48+flex+items-center+justify-center+text-6xl+text-gray-300+bg-gray-100>🚛</div><div class=absolute+top-4+right-4+bg-brand+text-white+rounded-full+px-4+py-2+text-xs+text-center+leading-tight+shadow-lg>报价生成时间<br><span class=font-semibold>'+timeStr+'</span></div>\'">';
  } else {
    html += '<div class="w-full h-48 flex items-center justify-center text-6xl text-gray-300 bg-gray-100">🚛</div>';
  }
  html += '<div class="absolute top-4 right-4 bg-brand text-white rounded-full px-4 py-2 text-xs text-center leading-tight shadow-lg">报价生成时间<br><span class="font-semibold">'+timeStr+'</span></div>';
  html += '<div class="p-4"><p class="text-xs text-gray-400">报价编号：'+quoteNo+'</p><p class="font-semibold mt-1">'+p.name+'</p></div>';
  html += '</div></div>';

  // Fee breakdown
  html += '<div class="bg-white rounded-xl sh-card overflow-hidden mb-5"><div class="p-5">';
  html += '<h3 class="font-semibold text-base mb-3">费用明细</h3>';
  html += '<table class="w-full text-sm"><thead><tr class="border-b-2 border-gray-100 text-left text-gray-400 text-xs uppercase tracking-wide"><th class="py-2 font-medium">项目</th><th class="py-2 font-medium text-right">金额</th></tr></thead><tbody>';
  html += '<tr class="border-b border-gray-50"><td class="py-2.5">裸车价格</td><td class="py-2.5 text-right font-medium">'+fmtFull(b.base)+'</td></tr>';
  var boxQuoteText = box.price===0?'标配':(selectedBox===0?fmtFull(box.price):'+'+fmtFull(box.price));
  html += '<tr class="border-b border-gray-50"><td class="py-2.5">厢体：'+box.name+'</td><td class="py-2.5 text-right font-medium">'+boxQuoteText+'</td></tr>';
  html += '<tr class="border-b border-gray-50"><td class="py-2.5">冷机：'+ac.name+'</td><td class="py-2.5 text-right font-medium">'+(function(){if(selectedAC===0)return'标配';if(ac.price>0)return'+'+fmtFull(ac.price);if(ac.price<0)return'-'+fmtFull(Math.abs(ac.price));return'同价';})()+'</td></tr>';
  p.addons.forEach(function(a,i) {
    if (selectedAddons.has(i)) html += '<tr class="border-b border-gray-50"><td class="py-2.5">'+a.name+'</td><td class="py-2.5 text-right font-medium text-red-500">+'+fmtFull(a.price)+'</td></tr>';
  });
  html += '<tr class="border-b border-gray-50"><td class="py-2.5">保险</td><td class="py-2.5 text-right font-medium">'+(p.otherFees?fmtFull(p.otherFees.insurance||0):'¥0')+'</td></tr>';
  html += '<tr class="border-b border-gray-50"><td class="py-2.5">上户费</td><td class="py-2.5 text-right font-medium">'+(p.otherFees?fmtFull(p.otherFees.registration||0):'¥0')+'</td></tr>';
  if (b.subsidy > 0) html += '<tr class="border-b border-gray-50 text-brand"><td class="py-2.5">国家补贴</td><td class="py-2.5 text-right font-semibold">-'+fmtFull(b.subsidy)+'</td></tr>';
  html += '<tr class="bg-gray-50"><td class="py-3 font-bold text-base">落地总价</td><td class="py-3 text-right font-bold text-xl text-brand">'+fmtFull(b.total)+' <span class="text-sm font-normal text-gray-400">('+fmt(b.total)+'万)</span></td></tr>';
  html += '</tbody></table></div></div>';

  // Notes
  if (p.subsidy > 0 && !selectedAddons.has('subsidy')) {
    html += '<div class="bg-amber-50 border border-amber-200 rounded-xl p-4 text-sm text-amber-800 mb-5"><i class="fa-solid fa-circle-info mr-1"></i>国家补贴'+fmt(p.subsidy)+'万需办理营运户，请咨询销售人员确认。</div>';
  }
  if (p.note) {
    html += '<div class="bg-amber-50 border border-amber-200 rounded-xl p-4 text-sm text-amber-800 mb-5"><i class="fa-solid fa-circle-info mr-1"></i>'+p.note+'</div>';
  }

  // Actions
  html += '<div class="no-print flex gap-3">';
  html += '<button onclick="backToConfig()" class="flex-1 py-3 rounded-lg border-2 border-gray-200 text-gray-600 font-medium text-sm hover:border-gray-300 transition-all active:scale-95">← 返回修改配置</button>';
  html += '<button onclick="shareQuote()" class="flex-1 py-3 rounded-lg bg-brand hover:bg-brand/90 text-white font-semibold text-sm transition-all active:scale-95">分享报价单给客户</button>';
  html += '</div>';

  document.getElementById('quoteContent').innerHTML = html;
  showPage('page-quote');
  window.scrollTo(0, 0);
}

// ============ SHARE ============
function shareQuote() {
  var p = currentProduct, b = calcTotal();
  var box = p.boxes[selectedBox];
  var ac = selectedAC === 0 ? p.defaultAC : p.optionalAC[selectedAC - 1];
  var acShareText = selectedAC===0?'标配':(ac.price>0?'+'+fmtFull(ac.price):(ac.price<0?'-'+fmtFull(Math.abs(ac.price)):'同价'));
  var boxShareText = box.price===0?'标配':(selectedBox===0?fmtFull(box.price):'+'+fmtFull(box.price));
  var text = '【冷藏车报价单】\n'+p.name+'\n\n━━ 费用明细 ━━\n裸车：'+fmtFull(b.base)+'\n厢体('+box.name+')：'+boxShareText+'\n冷机('+ac.name+')：'+acShareText+'\n';
  p.addons.forEach(function(a,i){ if(selectedAddons.has(i)) text += a.name+'：+'+fmtFull(a.price)+'\n'; });
  text += '保险+上户：'+fmtFull(b.fees)+'\n';
  if(b.subsidy>0) text += '国家补贴：-'+fmtFull(b.subsidy)+'\n';
  text += '\n✨ 预估落地总价：'+fmtFull(b.total)+'（'+fmt(b.total)+'万）';
  text += '\n\n⚠️ 当前报价价格仅作参考，具体金额请联系18084808070出详细报价方案';
  if (navigator.share) { navigator.share({ title: '冷藏车报价单', text: text }); }
  else { navigator.clipboard.writeText(text).then(function(){ alert('报价单已复制到剪贴板！'); }); }
}

// ============ SAVE IMAGE (mobile) ============
function saveQuoteImage() {
  var el = document.getElementById('quoteContent');
  if (!el || typeof html2canvas === 'undefined') { alert('图片生成组件加载失败，请检查网络后重试'); return; }
  var btn = document.getElementById('saveImgBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i>生成中…'; }
  html2canvas(el, { scale: 2, useCORS: true, backgroundColor: '#F7F8FA', windowWidth: document.documentElement.scrollWidth, onclone: function(clone) {
    // 克隆文档里移除 fixed 定位元素（顶部栏、底部条），避免被画进图片
    clone.querySelectorAll('.no-print').forEach(function(n) { n.style.display = 'none'; });
  }}).then(function(canvas) {
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-image mr-1"></i>保存图片'; }
    showImageOverlay(canvas.toDataURL('image/png'));
  }).catch(function(e) {
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-image mr-1"></i>保存图片'; }
    alert('图片生成失败：' + e.message);
  });
}
function showImageOverlay(dataUrl) {
  var overlay = document.createElement('div');
  overlay.id = 'imgOverlay';
  overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px;';
  var img = document.createElement('img');
  img.src = dataUrl;
  img.style.cssText = 'max-width:100%;max-height:72vh;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.5);';
  var tip = document.createElement('p');
  tip.style.cssText = 'color:#fff;font-size:13px;text-align:center;line-height:1.7;';
  tip.innerHTML = '👆 <b>长按图片保存到相册</b><br>保存后可发送给客户';
  var close = document.createElement('button');
  close.textContent = '✕ 关闭';
  close.style.cssText = 'background:#fff;color:#111;border:none;border-radius:10px;padding:10px 32px;font-size:14px;font-weight:600;';
  close.onclick = hideImageOverlay;
  overlay.appendChild(img);
  overlay.appendChild(tip);
  overlay.appendChild(close);
  overlay.onclick = function(e) { if (e.target === overlay) hideImageOverlay(); };
  document.body.appendChild(overlay);
}
function hideImageOverlay() {
  var o = document.getElementById('imgOverlay');
  if (o) o.remove();
}

// ============ NAVIGATION ============
function showPage(id) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}
function goHome() { showPage('page-home'); renderHome(); }
function backToConfig() {
  if (!currentProduct) return goHome();
  document.getElementById('sd1').className = 'step-dot active w-2.5 h-2.5 rounded-full inline-block bg-brand';
  document.getElementById('sd1').style.boxShadow = '0 0 0 4px rgba(0,133,106,.15)';
  document.getElementById('sd2').className = 'step-dot w-2.5 h-2.5 rounded-full inline-block bg-gray-300';
  document.getElementById('sd2').style.boxShadow = '';
  showPage('page-config');
}

renderHome();
</script>
